name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble portfolio site
        run: |
          mkdir -p site
          cp *.html *.css *.js site/
          for archive in images-*.zip; do unzip -q "$archive" -d site/; done
          if [ -d images ]; then cp -R images/. site/images/; fi
          if compgen -G 'portfolio-pdf-*.part' > /dev/null; then
            cat portfolio-pdf-*.part > site/uxui_younghyun_portfolio.pdf
          elif [ -f younghyun-portfolio.pdf ]; then
            cp younghyun-portfolio.pdf site/uxui_younghyun_portfolio.pdf
          elif [ -f uxui_younghyun_portfolio.pdf ]; then
            cp uxui_younghyun_portfolio.pdf site/uxui_younghyun_portfolio.pdf
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
